<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>PocketTracker</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="#"><b>₦</b> PocketTracker</a><nav><button data-v="dashboard">Dashboard</button><button data-v="transactions">Transactions</button><button data-v="budgets">Budgets</button><button data-v="reports">Reports</button><button data-v="settings">Settings</button></nav><div><button id="theme">☾</button><button id="add" class="primary">＋ Add</button></div></header><main id="app"></main><div id="modal" class="modal hidden"><form id="form" class="dialog"><button type="button" id="close" class="x">×</button><p class="eyebrow">TRANSACTION</p><h2 id="formTitle">Add transaction</h2><label>Description<input id="desc" required maxlength="100"></label><div class="two"><label>Amount<input id="amount" type="number" min=".01" step=".01" required></label><label>Type<select id="kind"><option value="expense">Expense</option><option value="income">Income</option></select></label></div><div class="two"><label>Category<select id="cat"><option>Food</option><option>Transport</option><option>Bills</option><option>Shopping</option><option>Entertainment</option><option>Health</option><option>Education</option><option>Salary</option><option>Housing</option><option>Other</option></select></label><label>Date<input id="date" type="date" required></label></div><label class="check"><input id="repeat" type="checkbox"> Repeat monthly</label><div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary">Save transaction</button></div></form></div><div id="toast"></div><script src="app.js"></script></body></html>
